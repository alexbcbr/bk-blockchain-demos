AWSTemplateFormatVersion:                         '2010-09-09'
Description:                                      >
  This template creates a Fabric client node, which will run the Fabric CLI and
  interact with a Fabric network. The client node is an EC2 instance, and will be created in
  its own VPC. Private VPC Endpoints will also be created, pointing to the Fabric service.
Parameters:
  KeyName:
    Type:                                         AWS::EC2::KeyPair::KeyName
    Description:                                  Name of an existing EC2 key pair to enable SSH access to the EC2 instance
  BlockchainVpcEndpointServiceName:
    Type:                                         String
    Description:                                  Name of the Blockchain VPC Endpoint. Obtained from running 'aws managedblockchain get-network'
 
Resources:
  BlockchainRootRole:
    Type:                                         "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version:                                  "2012-10-17"
        Statement:
          -
            Effect:                               "Allow"
            Principal:
              Service:
                -                                 "ec2.amazonaws.com"
            Action:
              -                                   "sts:AssumeRole"
      Path:                                       "/"
      MaxSessionDuration:                         10800
      Policies:
        -
          PolicyName:                             "root"
          PolicyDocument:
            Version:                              "2012-10-17"
            Statement:
              -
                Effect:                           "Allow"
                Action:                           "*"
                Resource:                         "*"
 
  BlockchainRootInstanceProfile:
    Type:                                         "AWS::IAM::InstanceProfile"
    Properties:
      Path:                                       "/"
      Roles:
        -
          Ref:                                    "BlockchainRootRole"
 
  BlockchainVPC:
    Type:                                         AWS::EC2::VPC
    Properties:
      CidrBlock:                                  10.0.0.0/16
      EnableDnsSupport:                           True
      EnableDnsHostnames:                         True
      InstanceTenancy:                            default
      Tags:
        - Key:                                    ReInventBlockchain
          Value:                                  VPC
 
  BlockchainPublicSubnet:
    Type:                                         AWS::EC2::Subnet
    Properties:
        VpcId:                                    !Ref BlockchainVPC
        MapPublicIpOnLaunch:                      false
        CidrBlock:                                10.0.0.0/16
        Tags:
        - Key:                                    ReInventBlockchain
          Value:                                  PublicSubnet
 
  BlockchainSecurityGroupBase:
        Type:                                     AWS::EC2::SecurityGroup
        Properties:
          GroupDescription:                       Base Security Group
          VpcId:                                  !Ref BlockchainVPC
          SecurityGroupIngress:
          - IpProtocol:                           tcp
            CidrIp:                               0.0.0.0/0
            FromPort:                             22
            ToPort:                               22
          - IpProtocol:                           tcp
            CidrIp:                               0.0.0.0/0
            FromPort:                             0
            ToPort:                               65535
          Tags:
          - Key:                                  ReInventBlockchain
            Value:                                BaseSecurityGroup
 
  BlockchainSecurityGroupBaseIngress:
    Type:                                         AWS::EC2::SecurityGroupIngress
    Properties:
      IpProtocol:                                 -1
      FromPort:                                   -1
      GroupId:                                    !GetAtt BlockchainSecurityGroupBase.GroupId
      ToPort:                                     -1
      SourceSecurityGroupId:                      !GetAtt BlockchainSecurityGroupBase.GroupId
      Tags:
      - Key:                                      ReInventBlockchain
        Value:                                    BaseSecurityGroupIngress
 
  BlockchainInternetGateway:
    Type:                                         "AWS::EC2::InternetGateway"
    Properties:
      Tags:
      - Key:                                      ReInventBlockchain
        Value:                                    InternetGateway
 
  BlockchainAttachGateway:
    Type:                                         AWS::EC2::VPCGatewayAttachment
    Properties:
       VpcId:                                     !Ref BlockchainVPC
       InternetGatewayId:                         !Ref BlockchainInternetGateway
 
  BlockchainRouteTable:
    Type:                                         AWS::EC2::RouteTable
    Properties:
        VpcId:                                    !Ref BlockchainVPC
        Tags:
          - Key:                                  ReInventBlockchain
            Value:                                RouteTable
 
  BlockchainRoute:
    Type:                                         AWS::EC2::Route
    Properties:
        RouteTableId:                             !Ref BlockchainRouteTable
        DestinationCidrBlock:                     0.0.0.0/0
        GatewayId:                                !Ref BlockchainInternetGateway
 
  BlockchainSubnetRouteTableAssociation:
    Type:                                         AWS::EC2::SubnetRouteTableAssociation
    Properties:
        SubnetId:                                 !Ref BlockchainPublicSubnet
        RouteTableId:                             !Ref BlockchainRouteTable
 
  BlockchainVPCEndpoint:
    Type:                                         AWS::EC2::VPCEndpoint
    Properties:
        VpcId:                                    !Ref BlockchainVPC
        PrivateDnsEnabled:                        True
        ServiceName:                              !Ref BlockchainVpcEndpointServiceName
        VpcEndpointType:                          Interface
        SubnetIds:                                [!Ref BlockchainPublicSubnet]
        SecurityGroupIds:                         [!Ref BlockchainSecurityGroupBase]
 
  BlockchainEC2:
    Type:                                         AWS::EC2::Instance
    Properties:
        KeyName:                                  !Ref KeyName
        ImageId:                                  'ami-08bc77a2c7eb2b1da'
        InstanceType:                             't2.small'
        IamInstanceProfile:                       !Ref BlockchainRootInstanceProfile
        NetworkInterfaces:
        - AssociatePublicIpAddress:               true
          DeviceIndex:                            0
          GroupSet:                               [!Ref BlockchainSecurityGroupBase]
          SubnetId:                               !Ref BlockchainPublicSubnet
        Tags:
          - Key:                                  Name
            Value:                                ManagedBlockchainEC2ClientInstance
 
  BlockchainELB:
    Type:                                         AWS::ElasticLoadBalancing::LoadBalancer
    Properties:
      SecurityGroups:                             [!Ref BlockchainSecurityGroupBase]
      Subnets:                                    [!Ref BlockchainPublicSubnet]
      Instances:
        - !Ref                                    BlockchainEC2
      Listeners:
        - LoadBalancerPort:                       '80'
          InstancePort:                           '3000'
          Protocol:                               TCP
      HealthCheck:
        Target:                                   HTTP:3000/health
        HealthyThreshold:                         '3'
        UnhealthyThreshold:                       '5'
        Interval:                                 '10'
        Timeout:                                  '5'
      Tags:
        - Key:                                    Name
          Value:                                  ELB
 
Outputs:
  VPCID:
    Description:                                  VPC ID
    Value:
      !Ref                                        BlockchainVPC
  PublicSubnetID:
    Description:                                  Public Subnet ID
    Value:
      !Ref                                        BlockchainPublicSubnet
  SecurityGroupID:
    Description:                                  Security Group ID
    Value:
      !GetAtt                                     BlockchainSecurityGroupBase.GroupId
  EC2URL:
    Description:                                  Public DNS of the EC2 instance
    Value:
      !GetAtt                                     BlockchainEC2.PublicDnsName
  ELBDNS:
    Description:                                  Public DNS of the ELB
    Value:
      !GetAtt                                     BlockchainELB.DNSName
  BlockchainVPCEndpoint:
    Description:                                  VPC Endpoint ID
    Value:
      !Ref                                        BlockchainVPCEndpoint